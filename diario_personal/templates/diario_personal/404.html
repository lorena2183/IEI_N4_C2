<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada · Diario Personal</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fbcfe8 0%, #e9d5ff 100%);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        .decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .flor { position: absolute; animation: float 6s ease-in-out infinite; filter: drop-shadow(0 4px 6px rgba(126, 34, 206, 0.15)); }
        .flor-1 { top: 8%; left: 6%; font-size: 3rem; }
        .flor-2 { bottom: 10%; right: 8%; font-size: 3.5rem; animation-delay: 2s; }
        .flor-3 { top: 12%; right: 10%; font-size: 2.5rem; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(126, 34, 206, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            max-width: 420px;
            width: 90%;
            z-index: 10;
        }

        .codigo {
            font-family: 'Alex Brush', cursive;
            font-size: 6rem;
            line-height: 1;
            color: #ec4899;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .titulo {
            font-size: 1.2rem;
            font-weight: 500;
            color: #7e22ce;
            margin: 0.5rem 0;
        }

        .mensaje {
            font-size: 0.9rem;
            color: #701a75;
            margin-bottom: 1.8rem;
        }

        .btn-volver {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ec4899 0%, #c026d3 50%, #7e22ce 100%);
            color: #fff;
            font-weight: 500;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.35);
            transition: all 0.3s ease;
        }
        .btn-volver:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(126, 34, 206, 0.5);
        }
    </style>
</head>
<body>

    <div class="decorations">
        <span class="flor flor-1">🌹</span>
        <span class="flor flor-2">🌷</span>
        <span class="flor flor-3">🌹</span>
    </div>

    <div class="card">
        <div class="codigo">404</div>
        <p class="titulo">Página no encontrada</p>
        <p class="mensaje">La página que buscas no existe o fue movida. Vuelve al inicio y sigue escribiendo tu diario 🌷</p>
        <a href="/" class="btn-volver">Volver al inicio ✨</a>
    </div>

</body>
</html>
