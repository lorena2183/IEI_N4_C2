<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida Especial</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fbcfe8 0%, #e9d5ff 100%);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Elementos decorativos de fondo */
        .decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .flower, .perfume, .pearls {
            position: absolute;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            animation: float 6s ease-in-out infinite;
        }

        .rose-1 { top: 8%; left: 6%; font-size: 3rem; animation-delay: 0s; }
        .rose-2 { bottom: 10%; right: 8%; font-size: 3.5rem; animation-delay: 2s; }
        .rose-3 { top: 12%; right: 10%; font-size: 2.5rem; animation-delay: 4s; }
        .perfume { bottom: 12%; left: 8%; font-size: 3.5rem; animation-delay: 1s; }
        .pearls { top: 5%; left: 50%; transform: translateX(-50%); font-size: 2rem; letter-spacing: 5px; opacity: 0.8; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        /* Tarjeta Principal */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            max-width: 380px;
            width: 90%;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .title {
            font-family: 'Alex Brush', cursive;
            font-size: 3.2rem;
            color: #9d174d;
            margin-bottom: 0.2rem;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #701a75;
            margin-bottom: 1.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .lock-icon {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Formulario y Contraseña */
        .input-group {
            margin-bottom: 1.5rem;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #f472b6;
            border-radius: 50px;
            outline: none;
            text-align: center;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: #831843;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: #c084fc;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
        }

        /* Botón */
        .btn-enter {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #f43f5e 0%, #ec4899 50%, #d946ef 100%);
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.35);
            transition: all 0.3s ease;
        }

        .btn-enter:hover {
            opacity: 0.95;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
        }

        .error-message {
            color: #e11d48;
            font-size: 0.8rem;
            margin-top: 0.8rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="decorations">
        <span class="pearls">🤍🤍🤍🤍🤍</span>
        <span class="flower rose-1">🌹</span>
        <span class="flower rose-2">🌹</span>
        <span class="flower rose-3">🌷</span>
        <span class="perfume">🧴</span>
    </div>

    <div class="card">
        <h1 class="title">Bienvenida</h1>
        <p class="subtitle">Ingresa para continuar</p>
        
        <div class="lock-icon">🔐</div>

        <form id="loginForm" onsubmit="validarAcceso(event)">
            <div class="input-group">
                <input type="password" id="password" placeholder="Contraseña..." required>
            </div>
            <button type="submit" class="btn-enter">Ingresar ✨</button>
            <p id="error" class="error-message">Contraseña incorrecta. Intenta de nuevo 🌷</p>
        </form>
    </div>

    <script>
        function validarAcceso(event) {
            event.preventDefault();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error');

            // Cambia '1234' por la contraseña que prefieras
            if (pass === '1234') {
                alert('¡Acceso concedido! 💕');
                // Redirección opcional:
                // window.location.href = "contenido.html";
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
