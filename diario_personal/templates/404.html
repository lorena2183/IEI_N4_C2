<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fbcfe8 0%, #e9d5ff 100%);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Elementos decorativos de fondo */
        .decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .flower, .perfume, .pearls {
            position: absolute;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            animation: float 6s ease-in-out infinite;
        }

        .rose-1 { top: 8%; left: 6%; font-size: 3rem; animation-delay: 0s; }
        .rose-2 { bottom: 10%; right: 8%; font-size: 3.5rem; animation-delay: 2s; }
        .rose-3 { top: 12%; right: 10%; font-size: 2.5rem; animation-delay: 4s; }
        .perfume { bottom: 12%; left: 8%; font-size: 3.5rem; animation-delay: 1s; }
        .pearls { top: 5%; left: 50%; transform: translateX(-50%); font-size: 2rem; letter-spacing: 5px; opacity: 0.8; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        /* Tarjeta Principal */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            max-width: 380px;
            width: 90%;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .error-code {
            font-family: 'Alex Brush', cursive;
            font-size: 6.5rem;
            line-height: 1;
            color: #9d174d;
            margin-bottom: 0.6rem;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .error-text {
            font-size: 1rem;
            font-weight: 500;
            color: #701a75;
            margin-bottom: 1.8rem;
            letter-spacing: 0.5px;
        }

        .lock-icon {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Botón de vuelta al inicio */
        .btn-enter {
            display: inline-block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #f43f5e 0%, #ec4899 50%, #d946ef 100%);
            color: white;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.35);
            transition: all 0.3s ease;
        }

        .btn-enter:hover {
            opacity: 0.95;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
        }
    </style>
</head>
<body>

    <div class="decorations">
        <span class="pearls">🤍🤍🤍🤍🤍</span>
        <span class="flower rose-1">🌹</span>
        <span class="flower rose-2">🌹</span>
        <span class="flower rose-3">🌷</span>
        <span class="perfume">🧴</span>
    </div>

    <div class="card">
        <div class="lock-icon">💔</div>
        <h1 class="error-code">404</h1>
        <p class="error-text">No se puede encontrar la página</p>
        <a href="/" class="btn-enter">Volver al inicio 🌷</a>
    </div>

</body>
</html>
